<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Shahruk Maharuj — Headless WordPress, Shopify App Developer and AI Product Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF">
        <animate attributeName="stop-color" values="#7C5CFF;#22D3EE;#34D399;#7C5CFF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#34D399;#7C5CFF;#22D3EE" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="280" rx="22"/></clipPath>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 3px; fill: #8B93A7; }
      .name { font-size: 50px; font-weight: 800; letter-spacing: -1.5px; fill: #F5F7FB; }
      .role { font-size: 26px; font-weight: 700; opacity: 0; animation: rotate 15s infinite; }
      .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; } .r5 { animation-delay: 12s; }
      .tag { font-size: 13px; font-weight: 500; fill: #C9CFDB; }
      .pill { fill: #FFFFFF; fill-opacity: 0.05; stroke: #FFFFFF; stroke-opacity: 0.09; }
      .status { font-size: 13px; font-weight: 600; fill: #34D399; }
      .pulse { animation: pulse 2s ease-out infinite; transform-origin: 62px 236px; }
      .sweep { animation: sweep 6s ease-in-out infinite; }
      .orb { animation: float 7s ease-in-out infinite; }
      @keyframes rotate {
        0% { opacity: 0; transform: translateY(14px); }
        4% { opacity: 1; transform: translateY(0); }
        17% { opacity: 1; transform: translateY(0); }
        20% { opacity: 0; transform: translateY(-14px); }
        100% { opacity: 0; transform: translateY(-14px); }
      }
      @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(3); opacity: 0; } }
      @keyframes sweep { 0% { transform: translateX(-260px); } 100% { transform: translateX(900px); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#grid)"/>
    <rect width="900" height="280" fill="url(#glow)"/>
    <rect class="sweep" y="0" width="220" height="2" fill="url(#accent)" opacity="0.9"/>

    <!-- decorative orbit -->
    <g class="orb" transform="translate(0,0)">
      <circle cx="770" cy="120" r="64" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.55"/>
      <circle cx="770" cy="120" r="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="834" cy="120" r="5" fill="#22D3EE">
        <animateTransform attributeName="transform" type="rotate" from="0 770 120" to="360 770 120" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="866" cy="120" r="3.5" fill="#FFFFFF" fill-opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="360 770 120" to="0 770 120" dur="16s" repeatCount="indefinite"/>
      </circle>
      <text x="770" y="128" text-anchor="middle" class="f" font-size="22" font-weight="800" fill="#F5F7FB">&lt;/&gt;</text>
    </g>

    <text x="56" y="62" class="f eyebrow">ENGINEER · BUILDER · PROBLEM-SOLVER</text>
    <text x="54" y="118" class="f name">Shahruk Maharuj</text>

    <g class="f">
      <text x="56" y="162" class="role r1" fill="url(#accent)">Headless WordPress Engineer</text>
      <text x="56" y="162" class="role r2" fill="url(#accent)">Shopify App Developer</text>
      <text x="56" y="162" class="role r3" fill="url(#accent)">AI Product &amp; Agent Builder</text>
      <text x="56" y="162" class="role r4" fill="url(#accent)">Next.js &amp; Node.js Engineer</text>
      <text x="56" y="162" class="role r5" fill="url(#accent)">Custom Plugin &amp; Theme Architect</text>
    </g>

    <g class="f">
      <rect x="54" y="190" width="132" height="28" rx="14" class="pill"/>
      <text x="120" y="209" text-anchor="middle" class="tag">Headless CMS</text>
      <rect x="194" y="190" width="116" height="28" rx="14" class="pill"/>
      <text x="252" y="209" text-anchor="middle" class="tag">Shopify Apps</text>
      <rect x="318" y="190" width="92" height="28" rx="14" class="pill"/>
      <text x="364" y="209" text-anchor="middle" class="tag">AI / RAG</text>
      <rect x="418" y="190" width="148" height="28" rx="14" class="pill"/>
      <text x="492" y="209" text-anchor="middle" class="tag">Core Web Vitals 95+</text>
    </g>

    <circle class="pulse" cx="62" cy="236" r="5" fill="#34D399"/>
    <circle cx="62" cy="236" r="5" fill="#34D399"/>
    <text x="76" y="241" class="f status">Available for new projects</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="279" rx="21.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
