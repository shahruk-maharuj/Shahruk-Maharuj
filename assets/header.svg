<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Shahruk Maharuj">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="240" rx="18"/></clipPath>
    <clipPath id="nameMask"><rect x="40" y="62" width="600" height="80"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .word { animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
      .w2 { animation-delay: .12s; }
      .fade { animation: fade .9s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
      .cell { fill: url(#acc); animation: wave 3.2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite backwards; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .line { animation: draw 1.4s cubic-bezier(0.16, 1, 0.3, 1) .5s backwards; transform-origin: 44px 0; }
      @keyframes rise { from { transform: translateY(82px); } }
      @keyframes fade { from { opacity: 0; transform: translateY(10px); } }
      @keyframes draw { from { transform: scaleX(0); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes wave {
        0% { transform: scale(0); }
        28% { transform: scale(1); }
        62% { transform: scale(1); }
        80% { transform: scale(0.35); }
        100% { transform: scale(1); }
      }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="240" fill="#0A0B0F"/>
    <text x="44" y="44" class="mono fade" font-size="13" fill="#6B7280">~/shahruk <tspan fill="#9CA3AF">— headless wp · shopify · ai · motion</tspan></text>
    <g clip-path="url(#nameMask)">
      <text x="42" y="126" class="sans word" font-size="60" font-weight="800" letter-spacing="-2" fill="#F4F4F5">Shahruk Maharuj</text>
    </g>
    <rect x="44" y="150" width="120" height="3" rx="1.5" fill="url(#acc)" class="line"/>
    <text x="44" y="190" class="sans fade" style="animation-delay:.6s" font-size="17" fill="#A1A1AA">I build websites, Shopify apps and AI tools — and I care how they move.</text>
